name: Aegis CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate Tactical EOC Web App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Vite Production Bundle Build
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -d dist || { echo "dist directory missing!"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing!"; exit 1; }
          echo "Build validation succeeded. Ready for automated Vercel CD deployment."
