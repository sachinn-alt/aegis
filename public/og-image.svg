<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#070a12"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Radar Grid Background Lines -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.5">
    <circle cx="880" cy="315" r="100"/>
    <circle cx="880" cy="315" r="180"/>
    <circle cx="880" cy="315" r="260"/>
    <line x1="620" y1="315" x2="1140" y2="315"/>
    <line x1="880" y1="55" x2="880" y2="575"/>
    <line x1="696" y1="131" x2="1064" y2="499"/>
    <line x1="696" y1="499" x2="1064" y2="131"/>
  </g>

  <!-- Cyclone Vortex Graphic -->
  <g transform="translate(880, 315)">
    <circle cx="0" cy="0" r="12" fill="#ff2a5f"/>
    <path d="M0 -60 C60 -60, 90 -10, 70 40 C50 80, 0 95, -50 70 C-90 45, -95 -20, -50 -55 C-20 -75, 30 -60, 45 -30 C55 0, 30 35, 0 35 C-20 35, -35 20, -25 0" fill="none" stroke="url(#vortexGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Branding and Content -->
  <g transform="translate(100, 160)">
    <!-- Pill -->
    <rect x="0" y="0" width="340" height="34" rx="6" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="16" y="23" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#00f0ff" letter-spacing="1.5">BRICS DISASTER RESILIENCE NETWORK</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="'Outfit', sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)" letter-spacing="3">RESILICOAST</text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="'Outfit', sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Predictive Cyclone Impact &amp; Critical Infrastructure Vulnerability Forecaster
    </text>

    <!-- Description -->
    <text x="0" y="215" font-family="'Outfit', sans-serif" font-size="18" fill="#64748b" width="600">
      Simulating Storm Surge Inundation, Power Grid Vulnerability &amp; Multilingual Early Warnings
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="165" height="38" rx="6" fill="#0e1424" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f8fafc">Google Cloud</text>

      <rect x="180" y="0" width="185" height="38" rx="6" fill="#0e1424" stroke="rgba(0, 240, 255, 0.3)"/>
      <text x="194" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00f0ff">Gemini 3.7 Flash</text>

      <rect x="380" y="0" width="175" height="38" rx="6" fill="#0e1424" stroke="rgba(0, 255, 170, 0.3)"/>
      <text x="394" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00ffaa">Earth Engine</text>

      <rect x="570" y="0" width="140" height="38" rx="6" fill="#0e1424" stroke="rgba(255, 42, 95, 0.3)"/>
      <text x="584" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ff2a5f">🇮🇳 🇿🇦 🇧🇷 🇨🇳</text>
    </g>
  </g>
</svg>
